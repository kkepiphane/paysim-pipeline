# Stack minimale Airflow (LocalExecutor + Postgres) pour faire tourner le pipeline,
# + un Postgres "warehouse" séparé pour servir le dashboard Streamlit (make dashboard).
# Pour un vrai cluster, remplacer par le compose officiel Airflow + Celery.
# version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${WAREHOUSE_USER:-warehouse}
      - POSTGRES_PASSWORD=${WAREHOUSE_PASSWORD:-warehouse}
      - POSTGRES_DB=${WAREHOUSE_DB:-warehouse}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    ports:
      - "${WAREHOUSE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  dashboard:
    image: paysim-pipeline:latest
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      - WAREHOUSE_USER=${WAREHOUSE_USER:-warehouse}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:-warehouse}
      - WAREHOUSE_DB=${WAREHOUSE_DB:-warehouse}
      - WAREHOUSE_HOST=warehouse
      - WAREHOUSE_PORT=5432
      - DATA_ROOT=/opt/airflow/data
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./src:/opt/airflow/src
      - ./dashboard:/opt/airflow/dashboard
      - ./data:/opt/airflow/data
    ports:
      - "8501:8501"
    command: python -m streamlit run dashboard/app.py --server.address 0.0.0.0

  airflow:
    build: .
    image: paysim-pipeline:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      - DATA_ROOT=/opt/airflow/data
      - PYTHONPATH=/opt/airflow
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: standalone

volumes:
  postgres_data:
  warehouse_data:
